version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - misspell
    - gofmt
    - revive
    - unconvert
    - unparam
    - unused

  settings:
    revive:
      rules:
        - name: exported
          severity: warning
        - name: var-naming
          severity: warning
        - name: indent-error-flow
          severity: warning
        - name: unused-parameter
          severity: warning

issues:
  max-issues-per-linter: 50
  max-same-issues: 5
